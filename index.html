<meta name='viewport' content='width=device-width, initial-scale=1'/>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 루틴 트래커</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome (아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .checkbox-custom:checked + label .checkbox-icon {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .checkbox-custom:checked + label .checkbox-icon i {
            display: block;
        }
        .checkbox-custom:checked + label .routine-title {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .checkbox-custom:checked + label .routine-desc {
            color: #cbd5e1;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md shadow-blue-200">
                    <i class="fa-solid fa-calendar-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">MY DAILY ROUTINE</h1>
                    <p class="text-xs text-slate-500">매일의 작은 습관이 만드는 큰 변화</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- 루틴 추가 버튼 -->
                <button id="openAddModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> 루틴 추가
                </button>

                <!-- 날짜 선택기 -->
                <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button id="prevDate" class="p-1 hover:bg-white rounded-md transition text-slate-600">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <input type="date" id="datePicker" class="bg-transparent font-medium text-xs text-slate-700 focus:outline-none cursor-pointer">
                    <button id="nextDate" class="p-1 hover:bg-white rounded-md transition text-slate-600">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

        <!-- 전체 달성률 현황 대시보드 -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 space-y-5">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">오늘의 루틴 달성률</h2>
                    <p id="progressText" class="text-xs text-slate-500 mt-0.5">총 0개 항목 중 0개 완료</p>
                </div>
                <div class="text-right">
                    <span id="totalPercent" class="text-3xl font-extrabold text-blue-600">0%</span>
                </div>
            </div>
            
            <!-- 프로그레스 바 -->
            <div class="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-200/60">
                <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <!-- 오전/오후 개별 달성 요약 -->
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                <div class="flex items-center justify-between bg-amber-50/60 p-3 rounded-xl border border-amber-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-sun text-amber-500 text-sm"></i>
                        <span class="text-xs font-semibold text-slate-700">오전 루틴</span>
                    </div>
                    <span id="morningCount" class="text-xs font-bold text-amber-700">0/0</span>
                </div>
                <div class="flex items-center justify-between bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-moon text-indigo-500 text-sm"></i>
                        <span class="text-xs font-semibold text-slate-700">오후 루틴</span>
                    </div>
                    <span id="afternoonCount" class="text-xs font-bold text-indigo-700">0/0</span>
                </div>
            </div>
        </section>

        <!-- 최근 7일 달성률 추이 그래프 섹션 -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-blue-500"></i> 최근 7일 달성률 흐름
                    </h3>
                    <p class="text-xs text-slate-400 mt-0.5">일자별 달성률 추이를 한눈에 확인하세요</p>
                </div>
                <div class="flex gap-2">
                    <span class="text-[11px] font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded-md">
                        주간 평균: <b id="avgPercentText" class="text-blue-600">0%</b>
                    </span>
                </div>
            </div>

            <!-- 캔버스 차트 영역 -->
            <div class="w-full h-48 pt-2">
                <canvas id="weeklyChart"></canvas>
            </div>
        </section>

        <!-- 오전 루틴 섹션 -->
        <section class="space-y-3">
            <div class="flex items-center gap-2 px-1">
                <div class="w-2 h-4 bg-amber-500 rounded-full"></div>
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-sun text-amber-500"></i> 오전 루틴
                </h3>
                <span id="morningTotalTag" class="text-xs text-slate-400 font-normal">0개 항목</span>
            </div>

            <div class="space-y-2.5" id="morningList">
                <!-- 동적 루틴 카드가 생성되는 구역 -->
            </div>
        </section>

        <!-- 오후 루틴 섹션 -->
        <section class="space-y-3 pt-2">
            <div class="flex items-center gap-2 px-1">
                <div class="w-2 h-4 bg-indigo-500 rounded-full"></div>
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-moon text-indigo-500"></i> 오후 루틴
                </h3>
                <span id="afternoonTotalTag" class="text-xs text-slate-400 font-normal">0개 항목</span>
            </div>

            <div class="space-y-2.5" id="afternoonList">
                <!-- 동적 루틴 카드가 생성되는 구역 -->
            </div>
        </section>

        <!-- 축하 메시지 (전체 완료 시 노출) -->
        <div id="congratsBanner" class="hidden bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-5 rounded-2xl shadow-lg text-center space-y-1 transform transition-all">
            <div class="text-2xl">🎉</div>
            <h4 class="font-bold text-lg">오늘의 모든 루틴을 달성했습니다!</h4>
            <p class="text-xs text-emerald-100">꾸준함이 만드는 변화, 오늘 하루도 정말 수고하셨습니다.</p>
        </div>

    </main>

    <!-- 루틴 추가/수정 모달 팝업 -->
    <div id="routineModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">새 루틴 추가</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="routineForm" class="space-y-3">
                <input type="hidden" id="editRoutineId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">구분</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition text-xs font-semibold">
                            <input type="radio" name="modalCategory" value="morning" checked class="accent-blue-600">
                            <i class="fa-solid fa-sun text-amber-500"></i> 오전 루틴
                        </label>
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition text-xs font-semibold">
                            <input type="radio" name="modalCategory" value="afternoon" class="accent-blue-600">
                            <i class="fa-solid fa-moon text-indigo-500"></i> 오후 루틴
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">루틴 이름 *</label>
                    <input type="text" id="modalTitleInput" required placeholder="예: 영양제 챙겨먹기" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상세 설명</label>
                    <input type="text" id="modalDescInput" placeholder="예: 비타민C, 오메가3 섭취" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">시간 / 태그</label>
                    <input type="text" id="modalTagInput" placeholder="예: 10분, 건강, 식단관리 등" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" id="cancelModalBtn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-xl transition">취소</button>
                    <button type="submit" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition shadow-md shadow-blue-100" id="submitModalBtn">추가하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 개별 루틴 히스토리 조회 모달 -->
    <div id="historyModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg text-sm">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div>
                        <h3 id="historyModalTitle" class="text-base font-bold text-slate-800">루틴 달성 히스토리</h3>
                        <p id="historyModalSubtitle" class="text-xs text-slate-400">과거 달성 내역 및 통계</p>
                    </div>
                </div>
                <button id="closeHistoryModalBtn" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- 히스토리 요약 지표 -->
            <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl text-center border border-slate-100">
                <div>
                    <span class="block text-[11px] text-slate-400">최근 14일 달성률</span>
                    <span id="historyRateText" class="text-sm font-extrabold text-blue-600">0%</span>
                </div>
                <div class="border-x border-slate-200/60">
                    <span class="block text-[11px] text-slate-400">총 완료 횟수</span>
                    <span id="historyTotalCountText" class="text-sm font-extrabold text-slate-700">0회</span>
                </div>
                <div>
                    <span class="block text-[11px] text-slate-400">연속 달성</span>
                    <span id="historyStreakText" class="text-sm font-extrabold text-emerald-600">0일</span>
                </div>
            </div>

            <!-- 히스토리 날짜별 수행 목록 -->
            <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="historyListContainer">
                <!-- 동적으로 일자별 달성 내역 생성 -->
            </div>

            <div class="pt-2">
                <button id="confirmHistoryBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // 기본 10개 초기 데이터 정의
        const DEFAULT_ROUTINES = [
            { id: 'r1', category: 'morning', title: '1. 웨이트 트레이닝', desc: '기본 근력 운동 진행 및 기록', tag: '1시간', tagBg: 'bg-slate-100', tagColor: 'text-slate-600' },
            { id: 'r2', category: 'morning', title: '2. 아침식단', desc: '헬시팩 + 단백질쉐이크 섭취', tag: '식단관리', tagBg: 'bg-emerald-50', tagColor: 'text-emerald-600' },
            { id: 'r3', category: 'morning', title: '3. 경제신문 완독', desc: '오늘 자 주요 경제 뉴스/신문 완독하기', tag: '자기계발', tagBg: 'bg-blue-50', tagColor: 'text-blue-600' },
            { id: 'r4', category: 'morning', title: '4. 주요기사 토론회', desc: '최소 2개 주제 / 5번 이상의 대화 주고받기', tag: '토론/인사이트', tagBg: 'bg-purple-50', tagColor: 'text-purple-600' },
            { id: 'r5', category: 'morning', title: '5. 귀 마사지', desc: '귓볼 당기기 + 귀접기 + 귀뒤뿌리 자극', tag: '10분', tagBg: 'bg-rose-50', tagColor: 'text-rose-600' },
            { id: 'r6', category: 'afternoon', title: '6. 바이브코딩 어플 제작', desc: '바이브코딩 진행 (최소 1개 대화라도 진행하기)', tag: '개발 프로젝트', tagBg: 'bg-sky-50', tagColor: 'text-sky-600' },
            { id: 'r7', category: 'afternoon', title: '7. 개인 휴식', desc: '16시 전후 가벼운 휴식 타임 갖기', tag: '30분', tagBg: 'bg-amber-50', tagColor: 'text-amber-600' },
            { id: 'r8', category: 'afternoon', title: '8. 책 읽기', desc: '최소 30페이지 이상 읽기', tag: '독서', tagBg: 'bg-emerald-50', tagColor: 'text-emerald-600' },
            { id: 'r9', category: 'afternoon', title: '9. 악력기 운동', desc: '세트당 30회, 총 5세트 수행', tag: '운동', tagBg: 'bg-orange-50', tagColor: 'text-orange-600' },
            { id: 'r10', category: 'afternoon', title: '10. 눈감고 명상', desc: '라벤더 향수와 함께하는 릴렉스 명상', tag: '10분', tagBg: 'bg-indigo-50', tagColor: 'text-indigo-600' }
        ];

        // 전역 상태
        let routines = [];
        let weeklyChart = null;

        // DOM 요소
        const datePicker = document.getElementById('datePicker');
        const prevDateBtn = document.getElementById('prevDate');
        const nextDateBtn = document.getElementById('nextDate');
        
        const progressBar = document.getElementById('progressBar');
        const totalPercent = document.getElementById('totalPercent');
        const progressText = document.getElementById('progressText');
        const morningCount = document.getElementById('morningCount');
        const afternoonCount = document.getElementById('afternoonCount');
        const morningTotalTag = document.getElementById('morningTotalTag');
        const afternoonTotalTag = document.getElementById('afternoonTotalTag');
        const congratsBanner = document.getElementById('congratsBanner');
        const avgPercentText = document.getElementById('avgPercentText');

        const morningList = document.getElementById('morningList');
        const afternoonList = document.getElementById('afternoonList');

        // 루틴 추가/수정 모달 DOM
        const routineModal = document.getElementById('routineModal');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const routineForm = document.getElementById('routineForm');
        const editRoutineId = document.getElementById('editRoutineId');
        const modalTitle = document.getElementById('modalTitle');
        const modalTitleInput = document.getElementById('modalTitleInput');
        const modalDescInput = document.getElementById('modalDescInput');
        const modalTagInput = document.getElementById('modalTagInput');
        const submitModalBtn = document.getElementById('submitModalBtn');

        // 히스토리 모달 DOM
        const historyModal = document.getElementById('historyModal');
        const closeHistoryModalBtn = document.getElementById('closeHistoryModalBtn');
        const confirmHistoryBtn = document.getElementById('confirmHistoryBtn');
        const historyModalTitle = document.getElementById('historyModalTitle');
        const historyRateText = document.getElementById('historyRateText');
        const historyTotalCountText = document.getElementById('historyTotalCountText');
        const historyStreakText = document.getElementById('historyStreakText');
        const historyListContainer = document.getElementById('historyListContainer');

        // YYYY-MM-DD 날짜 포맷
        function getFormattedDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 초기 날짜 세팅
        let currentDate = new Date();
        datePicker.value = getFormattedDate(currentDate);

        // 마스터 루틴 목록 로드
        function initRoutines() {
            const savedRoutines = localStorage.getItem('master_routines');
            if (savedRoutines) {
                routines = JSON.parse(savedRoutines);
            } else {
                routines = [...DEFAULT_ROUTINES];
                saveMasterRoutines();
            }
        }

        function saveMasterRoutines() {
            localStorage.setItem('master_routines', JSON.stringify(routines));
        }

        // 루틴 카드 렌더링
        function renderRoutines() {
            morningList.innerHTML = '';
            afternoonList.innerHTML = '';

            let morningTotal = 0;
            let afternoonTotal = 0;

            routines.forEach(r => {
                if (r.category === 'morning') morningTotal++;
                if (r.category === 'afternoon') afternoonTotal++;

                const cardHtml = `
                    <div class="routine-card bg-white rounded-xl border border-slate-200/80 p-4 shadow-sm hover:border-slate-300 transition group relative">
                        <input type="checkbox" id="${r.id}" class="checkbox-custom hidden" data-category="${r.category}" data-id="${r.id}">
                        <label for="${r.id}" class="flex items-start gap-3.5 cursor-pointer select-none">
                            <div class="checkbox-icon w-6 h-6 rounded-lg border-2 border-slate-300 flex items-center justify-center shrink-0 mt-0.5 transition-all">
                                <i class="fa-solid fa-check text-white text-xs hidden"></i>
                            </div>
                            <div class="flex-1 pr-20">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="routine-title font-semibold text-slate-800">${r.title}</span>
                                    ${r.tag ? `<span class="px-2 py-0.5 text-[11px] font-medium ${r.tagBg || 'bg-slate-100'} ${r.tagColor || 'text-slate-600'} rounded-md shrink-0">${r.tag}</span>` : ''}
                                </div>
                                ${r.desc ? `<p class="routine-desc text-xs text-slate-500 mt-1">${r.desc}</p>` : ''}
                            </div>
                        </label>
                        <!-- 히스토리, 수정, 삭제 버튼 구역 -->
                        <div class="absolute right-3 top-3.5 flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">
                            <button onclick="openHistoryModal('${r.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 rounded-lg transition" title="히스토리">
                                <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                            </button>
                            <button onclick="openEditModal('${r.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 rounded-lg transition" title="수정">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteRoutine('${r.id}')" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-lg transition" title="삭제">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;

                if (r.category === 'morning') {
                    morningList.insertAdjacentHTML('beforeend', cardHtml);
                } else {
                    afternoonList.insertAdjacentHTML('beforeend', cardHtml);
                }
            });

            morningTotalTag.textContent = `${morningTotal}개 항목`;
            afternoonTotalTag.textContent = `${afternoonTotal}개 항목`;

            // 체크박스 이벤트 바인딩
            document.querySelectorAll('.checkbox-custom').forEach(cb => {
                cb.addEventListener('change', () => {
                    saveRoutineState(datePicker.value);
                    updateProgress();
                });
            });

            loadRoutineState(datePicker.value);
        }

        // 루틴 수정 모달 열기
        window.openEditModal = function(id) {
            const target = routines.find(r => r.id === id);
            if (!target) return;

            editRoutineId.value = target.id;
            modalTitle.textContent = '루틴 수정하기';
            modalTitleInput.value = target.title;
            modalDescInput.value = target.desc || '';
            modalTagInput.value = target.tag || '';

            const radios = routineForm.elements['modalCategory'];
            for (let radio of radios) {
                if (radio.value === target.category) radio.checked = true;
            }

            submitModalBtn.textContent = '수정 완료';
            routineModal.classList.remove('hidden');
        };

        // 루틴 삭제 기능
        window.deleteRoutine = function(id) {
            if (confirm('이 루틴을 삭제하시겠습니까?')) {
                routines = routines.filter(r => r.id !== id);
                saveMasterRoutines();
                renderRoutines();
            }
        };

        // 개별 루틴 히스토리 모달 열기
        window.openHistoryModal = function(id) {
            const target = routines.find(r => r.id === id);
            if (!target) return;

            historyModalTitle.textContent = target.title;
            historyListContainer.innerHTML = '';

            const baseDate = new Date(datePicker.value);
            let totalChecked14Days = 0;
            let totalCheckedAllTime = 0;
            let currentStreak = 0;
            let isStreakActive = true;

            // 최근 14일 달성 내역 생성
            for (let i = 0; i < 14; i++) {
                const targetDate = new Date(baseDate);
                targetDate.setDate(baseDate.getDate() - i);
                const dateStr = getFormattedDate(targetDate);
                
                const savedData = JSON.parse(localStorage.getItem(`routine_${dateStr}`)) || {};
                const isCompleted = savedData[target.id] || false;

                if (isCompleted) {
                    totalChecked14Days++;
                    if (isStreakActive) currentStreak++;
                } else {
                    if (i > 0) isStreakActive = false; // 오늘 미완료는 스트릭 중단 처리에서 유예 가능
                }

                const monthDayStr = `${targetDate.getFullYear()}.${String(targetDate.getMonth() + 1).padStart(2, '0')}.${String(targetDate.getDate()).padStart(2, '0')}`;
                
                const historyRow = `
                    <div class="flex items-center justify-between p-2.5 rounded-xl ${isCompleted ? 'bg-emerald-50/70 border border-emerald-100' : 'bg-slate-50 border border-slate-100'} text-xs">
                        <span class="font-medium text-slate-600">${monthDayStr}</span>
                        ${isCompleted 
                            ? `<span class="font-bold text-emerald-600 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> 완료</span>` 
                            : `<span class="font-medium text-slate-400 flex items-center gap-1"><i class="fa-regular fa-circle"></i> 미완료</span>`}
                    </div>
                `;
                historyListContainer.insertAdjacentHTML('beforeend', historyRow);
            }

            // 전 기간 총 완료 횟수 집계
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('routine_')) {
                    const data = JSON.parse(localStorage.getItem(key)) || {};
                    if (data[target.id]) totalCheckedAllTime++;
                }
            }

            const rate14 = Math.round((totalChecked14Days / 14) * 100);
            historyRateText.textContent = `${rate14}%`;
            historyTotalCountText.textContent = `${totalCheckedAllTime}회`;
            historyStreakText.textContent = `${currentStreak}일`;

            historyModal.classList.remove('hidden');
        };

        // 히스토리 모달 닫기
        function closeHistoryModal() {
            historyModal.classList.add('hidden');
        }

        closeHistoryModalBtn.addEventListener('click', closeHistoryModal);
        confirmHistoryBtn.addEventListener('click', closeHistoryModal);

        // 특정 날짜 달성률 계산 (0~100)
        function getPercentByDate(dateStr) {
            const savedData = JSON.parse(localStorage.getItem(`routine_${dateStr}`)) || {};
            if (routines.length === 0) return 0;

            let checkedCount = 0;
            routines.forEach(r => {
                if (savedData[r.id]) checkedCount++;
            });
            return Math.round((checkedCount / routines.length) * 100);
        }

        // 주간 차트 업데이트
        function updateWeeklyChart() {
            const selectedDate = new Date(datePicker.value);
            const labels = [];
            const dataScores = [];
            let totalSum = 0;

            for (let i = 6; i >= 0; i--) {
                const targetDate = new Date(selectedDate);
                targetDate.setDate(selectedDate.getDate() - i);
                
                const dateStr = getFormattedDate(targetDate);
                const monthDay = `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
                
                const score = getPercentByDate(dateStr);
                
                labels.push(monthDay);
                dataScores.push(score);
                totalSum += score;
            }

            const avg = Math.round(totalSum / 7);
            avgPercentText.textContent = `${avg}%`;

            const ctx = document.getElementById('weeklyChart').getContext('2d');

            if (weeklyChart) {
                weeklyChart.data.labels = labels;
                weeklyChart.data.datasets[0].data = dataScores;
                weeklyChart.update();
            } else {
                weeklyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '달성률 (%)',
                            data: dataScores,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.35,
                            pointRadius: 4,
                            pointBackgroundColor: '#3b82f6',
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) { return ` 달성률: ${context.parsed.y}%`; }
                                }
                            }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                ticks: {
                                    stepSize: 25,
                                    callback: function(value) { return value + '%'; },
                                    font: { size: 10 }
                                },
                                grid: { color: '#f1f5f9' }
                            },
                            x: {
                                ticks: { font: { size: 11 } },
                                grid: { display: false }
                            }
                        }
                    }
                });
            }
        }

        // 로컬스토리지 특정 날짜 데이터 로드
        function loadRoutineState(dateStr) {
            const savedData = JSON.parse(localStorage.getItem(`routine_${dateStr}`)) || {};
            
            document.querySelectorAll('.checkbox-custom').forEach(cb => {
                cb.checked = savedData[cb.dataset.id] || false;
            });

            updateProgress();
        }

        // 로컬스토리지 특정 날짜 데이터 저장
        function saveRoutineState(dateStr) {
            const stateData = {};
            document.querySelectorAll('.checkbox-custom').forEach(cb => {
                stateData[cb.dataset.id] = cb.checked;
            });
            localStorage.setItem(`routine_${dateStr}`, JSON.stringify(stateData));
        }

        // 달성률 및 UI 업데이트
        function updateProgress() {
            const checkboxes = document.querySelectorAll('.checkbox-custom');
            const total = checkboxes.length;
            
            let checkedTotal = 0;
            let morningChecked = 0;
            let morningTotal = 0;
            let afternoonChecked = 0;
            let afternoonTotal = 0;

            checkboxes.forEach(cb => {
                const category = cb.dataset.category;
                if (category === 'morning') morningTotal++;
                if (category === 'afternoon') afternoonTotal++;

                if (cb.checked) {
                    checkedTotal++;
                    if (category === 'morning') morningChecked++;
                    if (category === 'afternoon') afternoonChecked++;
                }
            });

            const percent = total > 0 ? Math.round((checkedTotal / total) * 100) : 0;

            // UI 텍스트 & 바 업데이트
            progressBar.style.width = `${percent}%`;
            totalPercent.textContent = `${percent}%`;
            progressText.textContent = `총 ${total}개 항목 중 ${checkedTotal}개 완료`;
            morningCount.textContent = `${morningChecked}/${morningTotal}`;
            afternoonCount.textContent = `${afternoonChecked}/${afternoonTotal}`;

            // 100% 달성 시 축하 배너
            if (percent === 100 && total > 0) {
                congratsBanner.classList.remove('hidden');
            } else {
                congratsBanner.classList.add('hidden');
            }

            // 차트 갱신
            updateWeeklyChart();
        }

        // 모달 열기 (신규 추가용)
        openAddModalBtn.addEventListener('click', () => {
            editRoutineId.value = '';
            modalTitle.textContent = '새 루틴 추가';
            routineForm.reset();
            submitModalBtn.textContent = '추가하기';
            routineModal.classList.remove('hidden');
        });

        // 모달 닫기
        function closeModal() {
            routineModal.classList.add('hidden');
            routineForm.reset();
            editRoutineId.value = '';
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // 루틴 폼 제출 (추가 / 수정)
        routineForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const category = routineForm.elements['modalCategory'].value;
            const title = modalTitleInput.value.trim();
            const desc = modalDescInput.value.trim();
            const tag = modalTagInput.value.trim();
            const targetId = editRoutineId.value;

            if (!title) return;

            if (targetId) {
                // 기존 루틴 수정
                const targetIndex = routines.findIndex(r => r.id === targetId);
                if (targetIndex !== -1) {
                    routines[targetIndex] = {
                        ...routines[targetIndex],
                        category,
                        title,
                        desc,
                        tag: tag || (category === 'morning' ? '오전' : '오후')
                    };
                }
            } else {
                // 신규 루틴 생성
                const newRoutine = {
                    id: 'r_' + Date.now(),
                    category: category,
                    title: title,
                    desc: desc,
                    tag: tag || (category === 'morning' ? '오전' : '오후'),
                    tagBg: category === 'morning' ? 'bg-amber-50' : 'bg-indigo-50',
                    tagColor: category === 'morning' ? 'text-amber-600' : 'text-indigo-600'
                };
                routines.push(newRoutine);
            }

            saveMasterRoutines();
            renderRoutines();
            closeModal();
        });

        // 날짜 이동 이벤트
        datePicker.addEventListener('change', (e) => {
            loadRoutineState(e.target.value);
        });

        prevDateBtn.addEventListener('click', () => {
            const dateObj = new Date(datePicker.value);
            dateObj.setDate(dateObj.getDate() - 1);
            const newDateStr = getFormattedDate(dateObj);
            datePicker.value = newDateStr;
            loadRoutineState(newDateStr);
        });

        nextDateBtn.addEventListener('click', () => {
            const dateObj = new Date(datePicker.value);
            dateObj.setDate(dateObj.getDate() + 1);
            const newDateStr = getFormattedDate(dateObj);
            datePicker.value = newDateStr;
            loadRoutineState(newDateStr);
        });

        // 앱 초기화 실행
        initRoutines();
        renderRoutines();
    </script>
</body>
</html>
